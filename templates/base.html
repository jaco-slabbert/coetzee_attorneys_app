<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}C&amp;C Attorneys | Coetzee & Co Attorneys{% endblock %}</title>
    <meta name="description" content="C&amp;C Attorneys offers modern, strategic legal guidance for commercial, property, litigation, and estate matters.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
    <link rel="shortcut icon" href="{{ url_for('static', path='/images/favicon.ico') }}">
</head>
<body>
    <header class="topbar">
        <div class="container header-inner">
            <a href="/" class="logo" aria-label="C&amp;C Attorneys home">
                <!-- <i class="fa-solid fa-scale-balanced"></i> -->
                <img src="{{ url_for('static', path='/images/Small_logo_dark.png') }}" alt="C&amp;C Attorneys logo">
                <div class="logo-text">
                    C&amp;C Attorneys
                    <span>Coetzee &amp; Co</span>
                </div>
            </a>
            <nav aria-label="Main navigation">
                <a href="/#process">Why C&amp;C</a>
                <a href="/#services">Our Expertise</a>
                <a href="/#reviews">Client Reviews</a>
                <a href="/#contact">Get in Touch</a>
            </nav>
            <a href="/#contact" class="btn-primary">Request Consultation</a>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container footer-grid">
            <div class="footer-col brand-column">
                <img src="{{ url_for('static', path='/images/Big_logo.png') }}" alt="C&amp;C Attorneys logo">
            </div>
            <div class="footer-col">
            </div>
            <div class="footer-col" style="align-content: center;">
                <h4>Legal Notice</h4>
                <p>Regulated by the Legal Practice Council (LPC) of South Africa.</p>
            </div>
        </div>
        <div class="container footer-bottom">
            <p>&copy; 2026 C&amp;C Attorneys. All rights reserved.</p>
        </div>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            requestAnimationFrame(() => {
                document.body.classList.add('is-ready');
            });

            const painPoints = document.querySelector('.pain-points');
            if (painPoints) {
                let hasAnimated = false;

                const revealSection = () => {
                    if (hasAnimated) return;
                    hasAnimated = true;
                    requestAnimationFrame(() => {
                        painPoints.classList.add('is-visible');
                    });
                };

                const observer = new IntersectionObserver((entries, currentObserver) => {
                    if (entries.some((entry) => entry.isIntersecting)) {
                        revealSection();
                        currentObserver.disconnect();
                    }
                }, {
                    threshold: [0.15, 0.3],
                    rootMargin: '0px 0px -8% 0px'
                });

                observer.observe(painPoints);
            }

            const revealSections = document.querySelectorAll('.section-reveal');
            if (revealSections.length) {
                const revealObserver = new IntersectionObserver((entries, observer) => {
                    entries.forEach((entry) => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('is-visible');
                            observer.unobserve(entry.target);
                        }
                    });
                }, {
                    threshold: [0.14, 0.28],
                    rootMargin: '0px 0px -8% 0px'
                });

                revealSections.forEach((section) => revealObserver.observe(section));
            }

            const serviceTabGroups = document.querySelectorAll('[data-service-tabs]');
            serviceTabGroups.forEach((group) => {
                const tabs = Array.from(group.querySelectorAll('.service-tab'));
                const panels = Array.from(group.querySelectorAll('.service-panel'));

                const activateTab = (tab) => {
                    const targetPanelId = tab.getAttribute('aria-controls');

                    tabs.forEach((item) => {
                        const isActive = item === tab;
                        item.classList.toggle('is-active', isActive);
                        item.setAttribute('aria-selected', String(isActive));
                        item.tabIndex = isActive ? 0 : -1;
                    });

                    panels.forEach((panel) => {
                        const isActive = panel.id === targetPanelId;
                        panel.classList.toggle('is-active', isActive);
                        panel.hidden = !isActive;
                    });
                };

                tabs.forEach((tab, index) => {
                    tab.tabIndex = index === 0 ? 0 : -1;
                    tab.addEventListener('click', () => activateTab(tab));
                    tab.addEventListener('keydown', (event) => {
                        if (!['ArrowRight', 'ArrowLeft', 'Home', 'End'].includes(event.key)) return;
                        event.preventDefault();

                        const currentIndex = tabs.indexOf(tab);
                        let nextIndex = currentIndex;

                        if (event.key === 'ArrowRight') {
                            nextIndex = (currentIndex + 1) % tabs.length;
                        } else if (event.key === 'ArrowLeft') {
                            nextIndex = (currentIndex - 1 + tabs.length) % tabs.length;
                        } else if (event.key === 'Home') {
                            nextIndex = 0;
                        } else if (event.key === 'End') {
                            nextIndex = tabs.length - 1;
                        }

                        tabs[nextIndex].focus();
                        activateTab(tabs[nextIndex]);
                    });
                });
            });
        });
    </script>
</body>
</html>
